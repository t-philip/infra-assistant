[project]
name = "infra-assistant"
version = "1.0.0"
description = "A minimal Telegram assistant for infrastructure Q&A: one LLM, a good system prompt, read-only MCP tools, and a provider fallback chain. No skills, no autonomy."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "T. Philip", email = "57439211+t-philip@users.noreply.github.com" }]
keywords = ["mcp", "telegram", "assistant", "homelab", "llm", "read-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "python-telegram-bot>=21,<23",
    # `mcp_client` reaches one private SDK helper (guarded by try/except) for the
    # auth'd HTTP transport, so keep the range tight and bump deliberately.
    "mcp>=2,<3",
    "httpx>=0.28.1,<1",
    # `zoneinfo` needs a tz database; Windows and minimal containers lack one.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# The default provider path. `--no-litellm` (or `use_litellm = false`) drops to
# a small hand-rolled OpenAI-compatible / Ollama caller with no extra deps.
litellm = ["litellm>=1.44,<2"]
all = ["infra-assistant[litellm]"]

[project.scripts]
infra-assistant = "infra_assistant.cli:main"

[project.urls]
# Filled in when the repo is published. Kept out of the code for now.
Homepage = "https://example.invalid/infra-assistant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_assistant"]

[dependency-groups]
dev = [
    "litellm>=1.44,<2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "ASYNC"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests", "scripts"]

# litellm ships no type stubs. python-telegram-bot and respx are fully typed and
# are deliberately NOT excused here, so mypy checks their integration surface.
[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
