name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: no-autonomy guarantee
        run: uv run python scripts/check_no_exec.py
      - name: vendored secret_redaction.py pin
        run: uv run python scripts/check_vendored.py
      - name: pytest
        run: uv run pytest -q
      - name: build
        run: uv build
